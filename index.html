<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشغيل أكواد C++</title>
</head>
<body>
    <h2>تشغيل أكواد C++ من Replit</h2>
    <p>اختر الملف الذي تريد تشغيله:</p>

    <select id="fileSelector">
        <option value="" disabled selected>اختر ملفًا</option>
        <option value="1.cxx">ملف 1</option>
        <option value="2.cxx">ملف 2</option>
        <option value="3.cxx">ملف 3</option>
        <option value="4.cxx">ملف 4</option>
        <option value="5.cxx">ملف 5</option>
        <option value="6.cxx">ملف 6</option>
        <option value="7.cxx">ملف 7</option>
        <option value="8.cxx">ملف 8</option>
        <option value="9.cxx">ملف 9</option>
    </select>

    <button onclick="openReplit()">🔄 تشغيل الكود</button>

    <script>
        function openReplit() {
            let file = document.getElementById("fileSelector").value;
            if (file) {
                let url = `https://replit.com/@bofazo911/myreplit2?file=${file}`;
                window.open(url, "_blank"); // يفتح الرابط في نافذة جديدة
            } else {
                alert("يرجى اختيار ملف أولاً!");
            }
        }
    </script>

</body>
</html>
