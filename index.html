            left: 10px;

            border: none;
            color: white;
            width: 35px;

            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;

            opacity: 1;

            background: rgba(46, 125, 50, 0.3);

            background: rgba(198, 40, 40, 0.3);
            border: 1px solid #c62828;

            color: #e0e0e0;

            caesar: `// Caesar Cipher - caesar.cxx
#include <iostream>
#include <string>
using namespace std;

string caesarCipher(string text, int shift, bool encrypt) {
    string result = "";
    for (char c : text) {
        if (isalpha(c)) {
            char base = isupper(c) ? 'A' : 'a';
            int offset = encrypt ? shift : -shift;
            char shifted = (c - base + offset + 26) % 26 + base;
            result += shifted;
        } else {
            result += c;
        }
    }
    return result;
}

int main() {
    string text;
    int shift;
    cout << "Enter text: ";
    getline(cin, text);
    cout << "Enter shift: ";
    cin >> shift;
    
    string encrypted = caesarCipher(text, shift, true);
    cout << "Encrypted: " << encrypted << endl;
    
    string decrypted = caesarCipher(encrypted, shift, false);
    cout << "Decrypted: " << decrypted << endl;
    
    return 0;
}`,

            vigenere: `// Vigenère Cipher - vigenere.cxx
#include <iostream>
#include <string>
using namespace std;

string vigenereCipher(string text, string key, bool encrypt) {
    string result = "";
    int keyLen = key.length();
    for (int i = 0, j = 0; i < text.length(); i++) {
        char c = text[i];
        if (isalpha(c)) {
            char base = isupper(c) ? 'A' : 'a';
            char keyChar = toupper(key[j % keyLen]);
            int offset = encrypt ? keyChar - 'A' : -(keyChar - 'A');
            char shifted = (c - base + offset + 26) % 26 + base;
            result += shifted;
            j++;
        } else {
            result += c;
        }
    }
    return result;
}

int main() {
    string text, key;
    cout << "Enter text: ";
    getline(cin, text);
    cout << "Enter key: ";
    getline(cin, key);
    
    string encrypted = vigenereCipher(text, key, true);
    cout << "Encrypted: " << encrypted << endl;
    
    string decrypted = vigenereCipher(encrypted, key, false);
    cout << "Decrypted: " << decrypted << endl;
    
    return 0;
}`,

            substitution: `// Substitution Cipher - substitution.cxx
#include <iostream>
#include <string>
#include <algorithm>
using namespace std;

string substitutionCipher(string text, string key, bool encrypt) {
    string alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    string result = "";
    transform(key.begin(), key.end(), key.begin(), ::toupper);
    
    for (char c : text) {
        if (isalpha(c)) {
            char upperC = toupper(c);
            size_t pos;
            if (encrypt) {
                pos = alphabet.find(upperC);
                if (pos != string::npos) {
                    char newChar = key[pos];
                    result += isupper(c) ? newChar : tolower(newChar);
                }
            } else {
                pos = key.find(upperC);
                if (pos != string::npos) {
                    char newChar = alphabet[pos];
                    result += isupper(c) ? newChar : tolower(newChar);
                }
            }
        } else {
            result += c;
        }
    }
    return result;
}

int main() {
    string text, key;
    cout << "Enter text: ";
    getline(cin, text);
    cout << "Enter substitution key (26 unique letters): ";
    getline(cin, key);
    
    if (key.length() != 26) {
        cerr << "Key must be exactly 26 characters long!" << endl;
        return 1;
    }
    
    string encrypted = substitutionCipher(text, key, true);
    cout << "Encrypted: " << encrypted << endl;
    
    string decrypted = substitutionCipher(encrypted, key, false);
    cout << "Decrypted: " << decrypted << endl;
    
    return 0;
}`,

#include <iostream>

using namespace std;

const vector<string> portaTable = {
    "NOPQRSTUVWXYZABCDEFGHIJKLM",  // A,B
    "NOPQRSTUVWXYZABCDEFGHIJKLM",  // A,B
    "OPQRSTUVWXYZNMABCDEFGHIJKL",  // C,D
    "OPQRSTUVWXYZNMABCDEFGHIJKL",  // C,D
    "PQRSTUVWXYZNOLMABCDEFGHIJK",  // E,F
    "PQRSTUVWXYZNOLMABCDEFGHIJK",  // E,F

    "RSTUVWXYZNOPQJKLMABCDEFGHI",  // I,J
    "RSTUVWXYZNOPQJKLMABCDEFGHI",  // I,J
    "STUVWXYZNOPQRJKLMABCDEFGH",   // K,L
    "STUVWXYZNOPQRJKLMABCDEFGH",   // K,L
    "TUVWXYZNOPQRSJKLMABCDEFG",    // M,N
    "TUVWXYZNOPQRSJKLMABCDEFG",    // M,N
    "UVWXYZNOPQRSTJKLMABCDEF",     // O,P
    "UVWXYZNOPQRSTJKLMABCDEF",     // O,P
    "VWXYZNOPQRSTUJKLMABCDE",      // Q,R
    "VWXYZNOPQRSTUJKLMABCDE",      // Q,R
    "WXYZNOPQRSTUVJKLMABCD",       // S,T
    "WXYZNOPQRSTUVJKLMABCD",       // S,T
    "XYZNOPQRSTUVWJKLMABC",        // U,V
    "XYZNOPQRSTUVWJKLMABC",        // U,V
    "YZNOPQRSTUVWXJKLMAB",         // W,X
    "YZNOPQRSTUVWXJKLMAB",         // W,X
    "ZNOPQRSTUVWXYJKLMA",          // Y,Z
    "ZNOPQRSTUVWXYJKLMA"           // Y,Z
};

string portaCipher(string text, string key, bool encrypt) {
    string result = "";
    int keyIndex = 0;
    string alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    
    for (char c : text) {
        if (isalpha(c)) {
            char upperC = toupper(c);
            char keyChar = toupper(key[keyIndex % key.length()]);
            int tableRow = keyChar - 'A';
            
            if (encrypt) {
                int pos = alphabet.indexOf(upperC);
                if (pos != string::npos) {
                    char newChar = portaTable[tableRow][pos];
                    result += isupper(c) ? newChar : tolower(newChar);
                    keyIndex++;
                }
            } else {
                size_t pos = portaTable[tableRow].find(upperC);
                if (pos != string::npos) {
                    char newChar = alphabet[pos];
                    result += isupper(c) ? newChar : tolower(newChar);
                    keyIndex++;
                }
            }
        } else {
            result += c;
        }
    }
    return result;
}

int main() {

    getline(cin, text);
    cout << "Enter key: ";
    getline(cin, key);
    
    string encrypted = portaCipher(text, key, true);
    cout << "Encrypted: " << encrypted << endl;
    
    string decrypted = portaCipher(encrypted, key, false);
    cout << "Decrypted: " << decrypted << endl;
    
    return 0;
}`,

            albam: `// Albam Cipher - albam.cxx
#include <iostream>
#include <string>
using namespace std;

string albamCipher(string text, bool encrypt) {
    string firstHalf = "ABCDEFGHIJKLM";
    string secondHalf = "NOPQRSTUVWXYZ";
    string result = "";
    
    for (char c : text) {
        if (isalpha(c)) {
            bool isLower = islower(c);
            char upperC = toupper(c);
            size_t pos;
            
            if (encrypt) {
                pos = firstHalf.find(upperC);
                if (pos != string::npos) {
                    char newChar = secondHalf[pos];
                    result += isLower ? tolower(newChar) : newChar;
                    continue;
                }
                
                pos = secondHalf.find(upperC);
                if (pos != string::npos) {
                    char newChar = firstHalf[pos];
                    result += isLower ? tolower(newChar) : newChar;
                    continue;
                }
            } else {
                pos = secondHalf.find(upperC);
                if (pos != string::npos) {
                    char newChar = firstHalf[pos];
                    result += isLower ? tolower(newChar) : newChar;
                    continue;
                }
                
                pos = firstHalf.find(upperC);
                if (pos != string::npos) {
                    char newChar = secondHalf[pos];
                    result += isLower ? tolower(newChar) : newChar;
                    continue;
                }
            }
        }
        result += c;
    }
    return result;
}

    string text;
    cout << "Enter text: ";
    getline(cin, text);
    
    string encrypted = albamCipher(text, true);
    cout << "Encrypted: " << encrypted << endl;
    
    string decrypted = albamCipher(encrypted, false);

    return 0;
}`,

        // تحديث حقل المفتاح والمعلومات
        function updateKeyField() {
            const cipher = document.getElementById('cipherSelect').value;
            const keyInput = document.getElementById('keyInput');
            const keyInfo = document.getElementById('keyInfo');
            
            const keylessCiphers = ['atbash', 'atbah', 'albam', 'trithemius'];
            keyInput.disabled = keylessCiphers.includes(cipher);
            
            if (keyInput.disabled) {

                keyInfo.textContent = "هذه الخوارزمية لا تحتاج لمفتاح";
            } else {
                keyInfo.textContent = cipherKeyInfo[cipher] || "أدخل المفتاح المطلوب للخوارزمية";
            }
            
            clearResults();
        }

        // مسح النتائج فقط
        function clearResults() {
            document.getElementById('resultOutput').value = '';
            hideStatus();
        }

        // مسح كل الحقول
        function clearAll() {
            document.getElementById('textInput').value = '';
            document.getElementById('keyInput').value = '';
            clearResults();
            showStatus("تم مسح جميع الحقول بنجاح", "success");
        }

        // إخفاء رسالة الحالة
        function hideStatus() {
            const statusElement = document.getElementById('statusMessage');
            statusElement.className = 'status';
        }

        // عرض رسالة الحالة
        function showStatus(message, type) {
            const statusElement = document.getElementById('statusMessage');
            statusElement.textContent = message;
            statusElement.className = `status ${type} show`;
            
            if (type !== 'error') {
                setTimeout(hideStatus, 5000);
            }
        }

        // نسخ النتيجة
        function copyResult() {
            const resultOutput = document.getElementById('resultOutput');
            if (!resultOutput.value) {
                showStatus("لا يوجد نص لنسخه", "error");
                return;
            }
            
            resultOutput.select();
            document.execCommand('copy');
            
            const copyIcon = document.getElementById('copyIcon');
            if (copyIcon) {
                copyIcon.classList.replace('fa-copy', 'fa-check');
                setTimeout(() => {
                    copyIcon.classList.replace('fa-check', 'fa-copy');
                }, 2000);
            }
            
            showStatus("تم نسخ النتيجة بنجاح!", "success");
        }

        // عرض الكود المصدري
        function showCode() {
            const cipher = document.getElementById('cipherSelect').value;
            if (!cipher) {
                showStatus("الرجاء اختيار خوارزمية أولاً", "error");
                return;
            }
            
            if (!cipherCodes[cipher]) {
                showStatus("الكود غير متوفر لهذه الخوارزمية حالياً", "info");
                return;
            }
            
            const modal = document.getElementById('codeModal');
            const title = document.getElementById('codeTitle');
            const codeDisplay = document.getElementById('codeDisplay');
            
            const cipherName = document.getElementById('cipherSelect')
                .options[document.getElementById('cipherSelect').selectedIndex].text;
            
            // استخراج اسم الملف من التعليق الأول في الكود
            let fileName = "algorithm.cxx";
            const firstLine = cipherCodes[cipher].split('\n')[0];
            if (firstLine.includes('-')) {
                fileName = firstLine.split('-')[1].trim();
            }
            
            title.innerHTML = `${cipherName} Cipher<br><small>${fileName}</small>`;
            codeDisplay.textContent = cipherCodes[cipher];
            modal.style.display = 'block';
        }

            clearResults();
            
            if (!cipher) {
                showStatus("الرجاء اختيار خوارزمية التشفير", "error");
                return;
            }
            
            if (!text) {
                showStatus("الرجاء إدخال النص", "error");
                return;
            }
            
            if (!['atbash', 'atbah', 'albam', 'trithemius'].includes(cipher) && !key) {
                showStatus("الرجاء إدخال المفتاح", "error");
                return;
            }

            let result;
            try {
                switch (cipher) {
                    case 'caesar': result = caesarCipher(text, key, mode); break;
                    case 'alberti': result = albertiCipher(text, key, mode); break;
                    case 'trithemius': result = trithemiusCipher(text, mode); break;
                    case 'substitution': result = substitutionCipher(text, key, mode); break;
                    case 'albam': result = albamCipher(text, mode); break;
                    case 'atbash': result = atbashCipher(text); break;
                    case 'atbah': result = atbahCipher(text); break;
                    case 'polybius': result = polybiusCipher(text, mode); break;
                    case 'vigenere': result = vigenereCipher(text, key, mode); break;
                    case 'autokey': result = autokeyCipher(text, key, mode); break;
                    case 'porta': result = portaCipher(text, key, mode); break;
                    case 'beaufort': result = beaufortCipher(text, key, mode); break;
                    case 'vernam': result = vernamCipher(text, key); break;
                    default: result = 'الخوارزمية غير معروفة';
                }
                
                document.getElementById('resultOutput').value = result;
                showStatus(`تم ${mode === 'encrypt' ? 'تشفير' : 'فك تشفير'} النص بنجاح`, "success");
                
            } catch (e) {
                showStatus(`خطأ: ${e.message}`, "error");
            }
        }

        // ========== دوال التشفير المصححة والنهائية ==========

        function caesarCipher(text, key, mode) {
            const shift = parseInt(key);
            if (isNaN(shift)) throw new Error('مفتاح سيزار يجب أن يكون رقماً صحيحاً');
            
            return text.replace(/[a-z]/gi, c => {
                const base = c <= 'Z' ? 65 : 97;
                const code = c.charCodeAt(0) - base;
                let newCode = mode === 'encrypt' ? (code + shift) % 26 : (code - shift) % 26;
                if (newCode < 0) newCode += 26;
                return String.fromCharCode(newCode + base);
            });
        }

        function albamCipher(text, mode) {
            const firstHalf = 'ABCDEFGHIJKLM';
            const secondHalf = 'NOPQRSTUVWXYZ';
            
            return text.replace(/[a-z]/gi, c => {
                const isLower = c === c.toLowerCase();
                const upperC = c.toUpperCase();
                
                if (mode === 'encrypt') {
                    const index = firstHalf.indexOf(upperC);
                    if (index !== -1) return isLower ? secondHalf[index].toLowerCase() : secondHalf[index];
                    
                    const index2 = secondHalf.indexOf(upperC);
                    if (index2 !== -1) return isLower ? firstHalf[index2].toLowerCase() : firstHalf[index2];
                } else {
                    const index = secondHalf.indexOf(upperC);
                    if (index !== -1) return isLower ? firstHalf[index].toLowerCase() : firstHalf[index];
                    
                    const index2 = firstHalf.indexOf(upperC);
                    if (index2 !== -1) return isLower ? secondHalf[index2].toLowerCase() : secondHalf[index2];
                }
                return c;
            });
        }

        function atbashCipher(text) {
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const reversed = 'ZYXWVUTSRQPONMLKJIHGFEDCBA';
            
            return text.replace(/[a-z]/gi, c => {
                const isLower = c === c.toLowerCase();
                const upperC = c.toUpperCase();
                const index = alphabet.indexOf(upperC);
                if (index === -1) return c;
                return isLower ? reversed[index].toLowerCase() : reversed[index];
            });
        }

        function substitutionCipher(text, key, mode) {
            if (!key || key.length !== 26) throw new Error('المفتاح يجب أن يحتوي على 26 حرفاً بالضبط');
            
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const upperKey = key.toUpperCase();
            
            // التحقق من أن المفتاح يحتوي على جميع الحروف
            const uniqueChars = new Set(upperKey.split(''));
            if (uniqueChars.size !== 26) {
                throw new Error('المفتاح يجب أن يحتوي على جميع الحروف الأبجدية بدون تكرار');
            }
            
            return text.replace(/[a-z]/gi, c => {
                const isLower = c === c.toLowerCase();
                const upperC = c.toUpperCase();
                const index = mode === 'encrypt' 
                    ? alphabet.indexOf(upperC) 
                    : upperKey.indexOf(upperC);
                if (index === -1) return c;
                const newChar = mode === 'encrypt' ? upperKey[index] : alphabet[index];
                return isLower ? newChar.toLowerCase() : newChar;
            });
        }

        function portaCipher(text, key, mode) {
            if (!key) throw new Error("مفتاح بورتا مطلوب");
            
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const portaTable = {
                'A': 'NOPQRSTUVWXYZABCDEFGHIJKLM', 'B': 'NOPQRSTUVWXYZABCDEFGHIJKLM',
                'C': 'OPQRSTUVWXYZNMABCDEFGHIJKL', 'D': 'OPQRSTUVWXYZNMABCDEFGHIJKL',
                'E': 'PQRSTUVWXYZNOLMABCDEFGHIJK', 'F': 'PQRSTUVWXYZNOLMABCDEFGHIJK',
                'G': 'QRSTUVWXYZNOPKLMABCDEFGHIJ', 'H': 'QRSTUVWXYZNOPKLMABCDEFGHIJ',
                'I': 'RSTUVWXYZNOPQJKLMABCDEFGHI', 'J': 'RSTUVWXYZNOPQJKLMABCDEFGHI',
                'K': 'STUVWXYZNOPQRJKLMABCDEFGH', 'L': 'STUVWXYZNOPQRJKLMABCDEFGH',
                'M': 'TUVWXYZNOPQRSJKLMABCDEFG', 'N': 'TUVWXYZNOPQRSJKLMABCDEFG',
                'O': 'UVWXYZNOPQRSTJKLMABCDEF', 'P': 'UVWXYZNOPQRSTJKLMABCDEF',
                'Q': 'VWXYZNOPQRSTUJKLMABCDE', 'R': 'VWXYZNOPQRSTUJKLMABCDE',
                'S': 'WXYZNOPQRSTUVJKLMABCD', 'T': 'WXYZNOPQRSTUVJKLMABCD',
                'U': 'XYZNOPQRSTUVWJKLMABC', 'V': 'XYZNOPQRSTUVWJKLMABC',
                'W': 'YZNOPQRSTUVWXJKLMAB', 'X': 'YZNOPQRSTUVWXJKLMAB',
                'Y': 'ZNOPQRSTUVWXYJKLMA', 'Z': 'ZNOPQRSTUVWXYJKLMA'
            };
            
            let result = '';
            let keyIndex = 0;
            
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (/[a-z]/i.test(c)) {
                    const isLower = c === c.toLowerCase();
                    const upperC = c.toUpperCase();
                    const keyChar = key[keyIndex % key.length].toUpperCase();
                    const tableRow = portaTable[keyChar];
                    
                    if (mode === 'encrypt') {
                        const textPos = alphabet.indexOf(upperC);
                        if (textPos !== -1) {
                            const encryptedChar = tableRow[textPos];
                            result += isLower ? encryptedChar.toLowerCase() : encryptedChar;
                            keyIndex++;
                        } else {
                            result += c;
                        }
                    } else {
                        const encryptedPos = tableRow.indexOf(upperC);
                        if (encryptedPos !== -1) {
                            const decryptedChar = alphabet[encryptedPos];
                            result += isLower ? decryptedChar.toLowerCase() : decryptedChar;
                            keyIndex++;
                        } else {
                            result += c;
                        }
                    }
                } else {
                    result += c;
                }
            }
            return result;
        }

        function vigenereCipher(text, key, mode) {
            if (!key) throw new Error("مفتاح فيجينير مطلوب");
            
            let result = '';
            let keyIndex = 0;
            const keyLen = key.length;
            
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (/[a-z]/i.test(c)) {
                    const isLower = c === c.toLowerCase();
                    const upperC = c.toUpperCase();
                    const keyChar = key[keyIndex % keyLen].toUpperCase();
                    
                    const base = 'A'.charCodeAt(0);
                    const textCode = upperC.charCodeAt(0) - base;
                    const keyCode = keyChar.charCodeAt(0) - base;
                    
                    let newCode = mode === 'encrypt' 
                        ? (textCode + keyCode) % 26 
                        : (textCode - keyCode + 26) % 26;
                    
                    const newChar = String.fromCharCode(newCode + base);
                    result += isLower ? newChar.toLowerCase() : newChar;
                    keyIndex++;
                } else {
                    result += c;
                }
            }
            return result;
        }

        function autokeyCipher(text, key, mode) {
            if (!key) throw new Error("مفتاح أوتوكي مطلوب");
            
            let result = '';
            let runningKey = key.toUpperCase();
            let textIndex = 0;
            
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (/[a-z]/i.test(c)) {
                    const isLower = c === c.toLowerCase();
                    const upperC = c.toUpperCase();
                    
                    const base = 'A'.charCodeAt(0);
                    const textCode = upperC.charCodeAt(0) - base;
                    const keyCode = runningKey.charCodeAt(textIndex) - base;
                    
                    let newCode;
                    if (mode === 'encrypt') {
                        newCode = (textCode + keyCode) % 26;
                        runningKey += String.fromCharCode(newCode + base);
                    } else {
                        newCode = (textCode - keyCode + 26) % 26;
                        runningKey += upperC;
                    }
                    
                    const newChar = String.fromCharCode(newCode + base);
                    result += isLower ? newChar.toLowerCase() : newChar;
                    textIndex++;
                } else {
                    result += c;
                }
            }
            return result;
        }

        function beaufortCipher(text, key, mode) {
            if (!key) throw new Error("مفتاح بوفورت مطلوب");
            
            let result = '';
            let keyIndex = 0;
            const keyLen = key.length;
            
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (/[a-z]/i.test(c)) {
                    const isLower = c === c.toLowerCase();
                    const upperC = c.toUpperCase();
                    const keyChar = key[keyIndex % keyLen].toUpperCase();
                    
                    const base = 'A'.charCodeAt(0);
                    const textCode = upperC.charCodeAt(0) - base;
                    const keyCode = keyChar.charCodeAt(0) - base;
                    
                    let newCode = (keyCode - textCode + 26) % 26;
                    const newChar = String.fromCharCode(newCode + base);
                    result += isLower ? newChar.toLowerCase() : newChar;
                    keyIndex++;
                } else {
                    result += c;
                }
            }
            return result;
        }

        function vernamCipher(text, key) {
            if (!key) throw new Error("مفتاح فيرنام مطلوب");
            if (key.length !== text.length) throw new Error("مفتاح فيرنام يجب أن يكون بنفس طول النص");
            
            let result = '';
            for (let i = 0; i < text.length; i++) {
                const textChar = text.charCodeAt(i);
                const keyChar = key.charCodeAt(i % key.length);
                const newChar = textChar ^ keyChar;
                result += String.fromCharCode(newChar);
            }
            return result;
        }

        function polybiusCipher(text, mode) {
            const square = [
                ['A', 'B', 'C', 'D', 'E'],
                ['F', 'G', 'H', 'I', 'K'],
                ['L', 'M', 'N', 'O', 'P'],
                ['Q', 'R', 'S', 'T', 'U'],
                ['V', 'W', 'X', 'Y', 'Z']
            ];
            
            if (mode === 'encrypt') {
                let result = '';
                for (let i = 0; i < text.length; i++) {
                    const c = text[i].toUpperCase();
                    if (c === 'J') {
                        result += '24';
                        continue;
                    }
                    
                    let found = false;
                    for (let row = 0; row < 5; row++) {
                        for (let col = 0; col < 5; col++) {
                            if (square[row][col] === c) {
                                result += (row + 1) + '' + (col + 1);
                                found = true;
                                break;
                            }
                        }
                        if (found) break;
                    }
                    if (!found) result += c;
                }
                return result;
            } else {
                let result = '';
                let i = 0;
                while (i < text.length) {
                    if (/\d/.test(text[i])) {
                        if (i + 1 < text.length && /\d/.test(text[i+1])) {
                            const row = parseInt(text[i]) - 1;
                            const col = parseInt(text[i+1]) - 1;
                            if (row >= 0 && row < 5 && col >= 0 && col < 5) {
                                result += square[row][col];
                            }
                            i += 2;
                        } else {
                            result += text[i];
                            i++;
                        }
                    } else {
                        result += text[i];
                        i++;
                    }
                }
                return result;
            }
        }

        function atbahCipher(text) {
            const mapping = {
                'A': 'I', 'B': 'H', 'C': 'G', 'D': 'F', 'E': 'E',
                'F': 'D', 'G': 'C', 'H': 'B', 'I': 'A',
                'J': 'R', 'K': 'Q', 'L': 'P', 'M': 'O', 'N': 'N',
                'O': 'M', 'P': 'L', 'Q': 'K', 'R': 'J',
                'S': 'Z', 'T': 'Y', 'U': 'X', 'V': 'W', 'W': 'V',
                'X': 'U', 'Y': 'T', 'Z': 'S'
            };
            
            return text.replace(/[a-z]/gi, c => {
                const isLower = c === c.toLowerCase();
                const upperC = c.toUpperCase();
                const mapped = mapping[upperC] || c;
                return isLower ? mapped.toLowerCase() : mapped;
            });
        }

        function albertiCipher(text, key, mode) {
            const shift = parseInt(key);
            if (isNaN(shift)) throw new Error('مفتاح ألبرتي يجب أن يكون رقماً بين 0-25');
            if (shift < 0 || shift > 25) throw new Error('مفتاح ألبرتي يجب أن يكون بين 0 و 25');
            
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const shiftedAlphabet = alphabet.slice(shift) + alphabet.slice(0, shift);
            
            return text.replace(/[a-z]/gi, c => {
                const isLower = c === c.toLowerCase();
                const upperC = c.toUpperCase();
                
                if (mode === 'encrypt') {
                    const index = alphabet.indexOf(upperC);
                    if (index !== -1) return isLower ? shiftedAlphabet[index].toLowerCase() : shiftedAlphabet[index];
                } else {
                    const index = shiftedAlphabet.indexOf(upperC);
                    if (index !== -1) return isLower ? alphabet[index].toLowerCase() : alphabet[index];
                }
                return c;
            });
        }

        function trithemiusCipher(text, mode) {
            let result = '';
            let shift = 0;
            
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (/[a-z]/i.test(c)) {
                    const isLower = c === c.toLowerCase();
                    const upperC = c.toUpperCase();
                    const base = 'A'.charCodeAt(0);
                    const code = upperC.charCodeAt(0) - base;
                    
                    let newCode = mode === 'encrypt' 
                        ? (code + shift) % 26 
                        : (code - shift + 26) % 26;
                    
                    const newChar = String.fromCharCode(newCode + base);
                    result += isLower ? newChar.toLowerCase() : newChar;
                    shift = (shift + 1) % 26;
                } else {
                    result += c;
                }
            }
            return result;
        }
